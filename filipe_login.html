<!DOCTYPE html>
<html lang="pt-PT">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FilipeAI - Chat com Registo e Login</title>
    
    <!-- 
      ========================================================================
      NOTAS DO SISTEMA & CREDENCIAIS PADRÃO:
      
      🔑 CONTA DE TESTE PRÉ-REGISTADA:
         - E-mail: filipe@ai.com
         - Palavra-passe: 1234
         
      ✨ NOTA SOBRE O REGISTO:
         Pode alternar para "Criar Conta", registar um e-mail novo e usar
         esses mesmos dados de seguida no ecrã de Login.
      ========================================================================
    -->

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background-color: #0d1117;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            color: #ffffff;
            padding: 20px;
        }

        .ai-container {
            text-align: center;
            margin-bottom: 20px;
        }

        .ai-text {
            font-size: 4rem;
            font-weight: 800;
            letter-spacing: 2px;
            text-transform: uppercase;
            background: linear-gradient(45deg, #00f2fe, #4facfe, #6a11cb);
            background-size: 200% auto;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: glow 3s ease infinite alternate;
        }

        /* Caixa de Autenticação */
        .auth-card {
            width: 100%;
            max-width: 400px;
            background: rgba(22, 27, 34, 0.8);
            border: 1px solid #30363d;
            border-radius: 16px;
            padding: 30px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5);
            text-align: center;
        }

        .auth-card h2 {
            font-size: 1.5rem;
            margin-bottom: 20px;
            color: #4facfe;
        }

        .input-group {
            margin-bottom: 15px;
            text-align: left;
        }

        .input-group label {
            display: block;
            font-size: 0.85rem;
            color: #8b949e;
            margin-bottom: 5px;
        }

        .input-group input {
            width: 100%;
            background: #0d1117;
            border: 1px solid #30363d;
            border-radius: 8px;
            padding: 12px;
            color: #ffffff;
            font-size: 0.95rem;
            outline: none;
        }

        .input-group input:focus {
            border-color: #58a6ff;
        }

        .auth-btn {
            width: 100%;
            background: linear-gradient(45deg, #00f2fe, #4facfe);
            border: none;
            border-radius: 8px;
            padding: 12px;
            color: #0d1117;
            font-weight: bold;
            font-size: 1rem;
            cursor: pointer;
            margin-top: 10px;
        }

        .switch-text {
            font-size: 0.85rem;
            color: #8b949e;
            margin-top: 15px;
        }

        .switch-text a {
            color: #58a6ff;
            text-decoration: none;
            cursor: pointer;
        }

        .switch-text a:hover {
            text-decoration: underline;
        }

        .status-msg {
            font-size: 0.85rem;
            margin-top: 10px;
            display: none;
        }

        .status-msg.error { color: #f85149; }
        .status-msg.success { color: #238636; }

        /* Interface do Chat */
        .chat-wrapper {
            width: 100%;
            max-width: 600px;
            background: rgba(22, 27, 34, 0.8);
            border: 1px solid #30363d;
            border-radius: 16px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5);
            display: none;
            flex-direction: column;
            overflow: hidden;
        }

        .chat-header {
            background: #161b22;
            padding: 15px 20px;
            border-bottom: 1px solid #30363d;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .user-info {
            font-size: 0.9rem;
            color: #8b949e;
        }

        .user-info span {
            color: #00f2fe;
            font-weight: bold;
        }

        .logout-btn {
            background: transparent;
            border: 1px solid #f85149;
            color: #f85149;
            padding: 6px 12px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.85rem;
            transition: all 0.2s;
        }

        .logout-btn:hover {
            background: #f85149;
            color: #ffffff;
        }

        .chat-box {
            height: 350px;
            padding: 20px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .message {
            max-width: 80%;
            padding: 12px 16px;
            border-radius: 14px;
            font-size: 0.95rem;
            line-height: 1.4;
            word-break: break-word;
        }

        .message.user {
            background-color: #238636;
            color: #ffffff;
            align-self: flex-end;
            border-bottom-right-radius: 2px;
        }

        .message.ai {
            background-color: #21262d;
            color: #c9d1d9;
            align-self: flex-start;
            border-bottom-left-radius: 2px;
            border: 1px solid #30363d;
        }

        .input-area {
            display: flex;
            padding: 15px;
            background: #161b22;
            border-top: 1px solid #30363d;
            gap: 10px;
        }

        .input-area input {
            flex: 1;
            background: #0d1117;
            border: 1px solid #30363d;
            border-radius: 8px;
            padding: 12px;
            color: #ffffff;
            font-size: 0.95rem;
            outline: none;
        }

        .input-area button {
            background: linear-gradient(45deg, #00f2fe, #4facfe);
            border: none;
            border-radius: 8px;
            padding: 0 20px;
            color: #0d1117;
            font-weight: bold;
            cursor: pointer;
        }

        @keyframes glow {
            0% { background-position: 0% 50%; filter: drop-shadow(0 0 2px rgba(0, 242, 254, 0.3)); }
            100% { background-position: 100% 50%; filter: drop-shadow(0 0 12px rgba(79, 172, 254, 0.6)); }
        }

        @media (max-width: 600px) {
            .ai-text { font-size: 2.5rem; }
            .chat-box { height: 280px; }
        }
    </style>
</head>
<body>

    <div class="ai-container">
        <h1 class="ai-text">FilipeAI</h1>
    </div>

    <!-- PAINEL DE AUTENTICAÇÃO -->
    <div class="auth-card" id="authCard">
        <div id="authFormFields"></div>
        <div class="status-msg" id="statusMessage"></div>
    </div>

    <!-- INTERFACE DE CHAT -->
    <div class="chat-wrapper" id="chatWrapper">
        <div class="chat-header">
            <div class="user-info">E-mail ativo: <span id="displayUser"></span></div>
            <button class="logout-btn" onclick="handleLogout()">Sair (Logout)</button>
        </div>
        <div class="chat-box" id="chatBox">
            <div class="message ai">Autenticação bem-sucedida! O teu e-mail foi validado com sucesso. Como posso ajudar-te hoje?</div>
        </div>
        <div class="input-area">
            <input type="text" id="userInput" placeholder="Escreve uma mensagem..." autocomplete="off">
            <button onclick="sendMessage()">Enviar</button>
        </div>
    </div>

    <script>
        // Memória local com conta padrão pré-registada
        let localUserDB = {
            "filipe@ai.com": "1234"
        };

        const authCard = document.getElementById('authCard');
        const authFormFields = document.getElementById('authFormFields');
        const statusMessage = document.getElementById('statusMessage');
        const chatWrapper = document.getElementById('chatWrapper');
        const displayUser = document.getElementById('displayUser');
        const chatBox = document.getElementById('chatBox');
        const userInput = document.getElementById('userInput');

        // Carrega o ecrã inicial de login
        window.onload = function() {
            renderLoginView();
        };

        function renderLoginView() {
            statusMessage.style.display = 'none';
            authFormFields.innerHTML = `
                <h2>Iniciar Sessão</h2>
                <div class="input-group">
                    <label>E-mail</label>
                    <input type="email" id="emailInput" placeholder="exemplo@email.com">
                </div>
                <div class="input-group">
                    <label>Palavra-passe</label>
                    <input type="password" id="passwordInput" placeholder="••••••••">
                </div>
                <button class="auth-btn" onclick="validateLogin()">Entrar</button>
                <div class="switch-text">
                    Ainda não tens conta? <a onclick="renderRegisterView()">Criar Conta</a>
                </div>
            `;
            document.getElementById('passwordInput').addEventListener('keypress', (e) => { if (e.key === 'Enter') validateLogin(); });
        }

        function renderRegisterView() {
            statusMessage.style.display = 'none';
            authFormFields.innerHTML = `
                <h2>Criar Conta</h2>
                <div class="input-group">
                    <label>Introduzir E-mail</label>
                    <input type="email" id="newEmailInput" placeholder="seu@email.com">
                </div>
