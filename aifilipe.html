<!DOCTYPE html>
<html lang="pt-PT">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FilipeAI - Web Connected</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background-color: #0d1117;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            color: #ffffff;
            padding: 20px;
        }

        .ai-container {
            text-align: center;
            margin-bottom: 20px;
        }

        .ai-text {
            font-size: 4rem;
            font-weight: 800;
            letter-spacing: 2px;
            text-transform: uppercase;
            background: linear-gradient(45deg, #00f2fe, #4facfe, #6a11cb);
            background-size: 200% auto;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: glow 3s ease infinite alternate;
        }

        .ai-badge {
            margin-top: 5px;
            display: inline-block;
            padding: 3px 12px;
            font-size: 0.8rem;
            color: #00ff66;
            border: 1px solid #00ff66;
            border-radius: 20px;
            text-transform: uppercase;
            letter-spacing: 3px;
            box-shadow: 0 0 10px rgba(0, 255, 102, 0.2);
        }

        .chat-wrapper {
            width: 100%;
            max-width: 600px;
            background: rgba(22, 27, 34, 0.8);
            border: 1px solid #30363d;
            border-radius: 16px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5);
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .chat-box {
            height: 400px;
            padding: 20px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .message {
            max-width: 80%;
            padding: 12px 16px;
            border-radius: 14px;
            font-size: 0.95rem;
            line-height: 1.4;
            word-break: break-word;
        }

        .message.user {
            background-color: #238636;
            color: #ffffff;
            align-self: flex-end;
            border-bottom-right-radius: 2px;
        }

        .message.ai {
            background-color: #21262d;
            color: #c9d1d9;
            align-self: flex-start;
            border-bottom-left-radius: 2px;
            border: 1px solid #30363d;
        }

        .input-area {
            display: flex;
            padding: 15px;
            background: #161b22;
            border-top: 1px solid #30363d;
            gap: 10px;
        }

        .input-area input {
            flex: 1;
            background: #0d1117;
            border: 1px solid #30363d;
            border-radius: 8px;
            padding: 12px;
            color: #ffffff;
            font-size: 0.95rem;
            outline: none;
        }

        .input-area input:focus {
            border-color: #4facfe;
        }

        .input-area button {
            background: linear-gradient(45deg, #00f2fe, #4facfe);
            border: none;
            border-radius: 8px;
            padding: 0 20px;
            color: #0d1117;
            font-weight: bold;
            font-size: 0.95rem;
            cursor: pointer;
        }

        .input-area button:disabled {
            background: #30363d;
            color: #8b949e;
            cursor: not-allowed;
        }

        @keyframes glow {
            0% { background-position: 0% 50%; filter: drop-shadow(0 0 2px rgba(0, 242, 254, 0.3)); }
            100% { background-position: 100% 50%; filter: drop-shadow(0 0 12px rgba(79, 172, 254, 0.6)); }
        }
    </style>
</head>
<body>

    <div class="ai-container">
        <h1 class="ai-text">FilipeAI</h1>
        <div class="ai-badge">Chave de API Ativa</div>
    </div>

    <div class="chat-wrapper">
        <div class="chat-box" id="chatBox">
            <div class="message ai">Olá, Filipe! O motor de ligação foi corrigido para o protocolo seguro local. Podes escrever a tua mensagem que irei responder usando a tua chave privada da Pollinations agora mesmo!</div>
        </div>
        <div class="input-area">
            <input type="text" id="userInput" placeholder="Pergunta o que quiseres à IA..." autocomplete="off">
            <button id="sendBtn" onclick="sendMessage()">Enviar</button>
        </div>
    </div>

    <script>
        const chatBox = document.getElementById('chatBox');
        const userInput = document.getElementById('userInput');
        const sendBtn = document.getElementById('sendBtn');

        // A tua chave privada autenticada
        const API_KEY = "pk_3hhjzgPIuPeBT9oo";

        async function sendMessage() {
            const text = userInput.value.trim();
            if (!text) return;

            // Insere mensagem no ecrã e tranca inputs
            appendMessage(text, 'user');
            userInput.value = '';
            userInput.disabled = true;
            sendBtn.disabled = true;

            const typingDiv = appendMessage('A processar resposta na rede...', 'ai');

            try {
                // Configuração do prompt do sistema para garantir respostas em português
                const systemPrompt = "Tu és o FilipeAI. Responde sempre em português de Portugal, de forma inteligente, curta e prestativa.";
                
                // Pedido via GET direto (aceite pelo navegador localmente e na Vercel com Chave Privada)
                const url = `https://pollinations.ai{encodeURIComponent(text)}?system=${encodeURIComponent(systemPrompt)}&model=openai&code=${API_KEY}`;
                
                const response = await fetch(url);
                if (!response.ok) throw new Error('Erro no servidor');
                
                const aiReply = await response.text();
                typingDiv.remove();

                // Exibe a resposta oficial da inteligência artificial
                appendMessage(aiReply, 'ai');

            } catch (error) {
                typingDiv.remove();
                appendMessage('Não foi possível obter dados. Garante que estás ligado à Internet ou tenta novamente.', 'ai');
                console.error(error);
            } finally {
                // Liberta os controlos do ecrã
                userInput.disabled = false;
                sendBtn.disabled = false;
                userInput.focus();
            }
        }

        function appendMessage(text, sender) {
            const msgDiv = document.createElement('div');
            msgDiv.classList.add('message', sender);
            msgDiv.innerText = text;
            chatBox.appendChild(msgDiv);
            chatBox.scrollTop = chatBox.scrollHeight;
            return msgDiv;
        }

        userInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter' && !userInput.disabled) sendMessage();
        });
    </script>

</body>
</html>
