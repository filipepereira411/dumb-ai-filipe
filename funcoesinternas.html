<!DOCTYPE html>
<html lang="pt-PT">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Processador de Visão Artificial - PAP</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background: #000000; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; height: 100vh; overflow: hidden; display: flex; flex-direction: column; justify-content: space-between; }

        /* Título superior do projeto */
        .header-title { background: #111111; color: #ffffff; text-align: center; padding: 15px; border-bottom: 1px solid #222222; display: flex; align-items: center; justify-content: center; gap: 8px; }
        .header-title h1 { font-size: 16px; font-weight: 600; letter-spacing: 0.5px; text-transform: uppercase; color: #00ff66; }
        .pulse-dot { inline-size: 8px; block-size: 8px; background-color: #00ff66; border-radius: 50%; display: inline-block; animation: pulse 1.5s infinite; }
        @keyframes pulse { 0% { transform: scale(0.9); opacity: 1; } 50% { transform: scale(1.2); opacity: 0.4; } 100% { transform: scale(0.9); opacity: 1; } }

        /* Área do Visor Neural */
        .viewer-container { position: relative; flex: 1; width: 100%; background: #0a0a0a; display: flex; align-items: center; justify-content: center; overflow: hidden; }
        video { width: 100%; height: 100%; object-fit: cover; display: none; }
        video.active { display: block; }
        video.mirror { transform: scaleX(-1); }

        /* Emulador de Fluxo de Vídeo por Canvas (Se o hardware falhar) */
        #demoCanvas { width: 100%; height: 100%; object-fit: cover; display: none; background: #07070a; }
        #demoCanvas.active { display: block; }

        /* Animação do Flash */
        .flash-effect { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: #ffffff; opacity: 0; z-index: 5; pointer-events: none; }
        .flash-effect.active { animation: flashAnim 0.2s ease-out; }
        @keyframes flashAnim { 0% { opacity: 1; } 100% { opacity: 0; } }
        
        .placeholder-text { position: absolute; color: #555555; font-size: 14px; text-align: center; padding: 20px; z-index: 2; font-family: monospace; }

        /* Caixas de Reconhecimento e Deteção de Alvos da IA */
        .ai-bounding-box { position: absolute; border: 2px dashed #00ff66; border-radius: 4px; display: none; z-index: 4; pointer-events: none; transition: all 0.2s ease-in-out; }
        .ai-label { position: absolute; top: -22px; left: -2px; background: #00ff66; color: #000; font-size: 11px; font-weight: bold; padding: 2px 6px; border-radius: 2px 2px 0 0; white-space: nowrap; font-family: monospace; }

        /* Painel Inferior de Logs de IA */
        .ai-status-panel { background: #111111; padding: 12px 20px; border-top: 1px solid #222222; font-family: monospace; font-size: 12px; color: #a0aec0; min-height: 55px; line-height: 1.5; }

        /* Barra de Controlos Inferior Inteligente (Import/Export Integrados) */
        .bottom-bar { height: 120px; background: #000000; display: flex; align-items: center; justify-content: space-around; padding: 0 20px; border-top: 1px solid #1a1a1a; }
        .cam-btn { width: 65px; height: 65px; border-radius: 50%; background: #ffffff; border: 5px solid #000000; box-shadow: 0 0 0 4px #ffffff; cursor: pointer; transition: transform 0.1s; -webkit-tap-highlight-color: transparent; }
        .cam-btn:active { transform: scale(0.92); }
        .cam-btn.off { background: #22c55e; box-shadow: 0 0 0 4px #22c55e; }

        .side-btn { width: 45px; height: 45px; border-radius: 50%; background: #1a1a1a; border: 1px solid #333; color: #ffffff; font-size: 18px; display: flex; align-items: center; justify-content: center; cursor: pointer; -webkit-tap-highlight-color: transparent; }
        .side-btn.danger { color: #ef4444; border-color: #ef4444; visibility: hidden; }
        
        /* Botões de Gestão de Ficheiros */
        .file-btn { background: #1a1a1a; border: 1px solid #00ff66; color: #00ff66; padding: 8px 12px; border-radius: 6px; font-family: monospace; font-size: 11px; font-weight: bold; cursor: pointer; display: flex; align-items: center; gap: 5px; transition: all 0.2s; }
        .file-btn:hover { background: #00ff66; color: #000; }
        
        #importInput { display: none; }
        canvas#captureCanvas { display: none; }
    </style>
</head>
<body>

    <!-- Cabeçalho Único -->
    <div class="header-title">
        <span class="pulse-dot"></span>
        <h1>Processador de Visão Artificial - PAP</h1>
    </div>

    <!-- Visor de Vídeo e Canvas Co-Processado -->
    <div class="viewer-container">
        <div id="flash" class="flash-effect"></div>
        <div id="placeholder" class="placeholder-text">SISTEMA NEURAL PRONTO<br><br>Pressione o botão verde central para iniciar a recolha...</div>
        
        <!-- Alvo Dinâmico Gerado pela IA -->
        <div id="aiBox" class="ai-bounding-box">
            <span class="ai-label" id="aiLabelText">🤖 ALVO RECONHECIDO (PAP-CORE)</span>
        </div>

        <!-- Fluxo de Hardware Real -->
        <video id="videoPlayer" autoplay playsinline></video>
        <!-- Fluxo Emulado em Falha Local -->
        <canvas id="demoCanvas"></canvas>
    </div>

    <!-- Consola de Monitorização Neural em Tempo Real -->
    <div class="ai-status-panel" id="aiStatusText">
        [STATUS]: Co-processador latente. Aguarda inicialização de periféricos locais...
    </div>

    <!-- Barra de Ação Física e Gestão de Dados -->
    <div class="bottom-bar">
        <!-- Esquerda: Importar JSON anterior -->
        <label for="importInput" class="file-btn">📥 IMPORTAR</label>
        <input type="file" id="importInput" accept=".json" onchange="importAIData(event)">

        <!-- Controlos Centrais Hardware -->
        <button id="stopBtn" class="side-btn danger" onclick="stopCamera()">❌</button>
        <button id="actionBtn" class="cam-btn off" onclick="handleCameraAction()"></button>
        <button id="flipBtn" class="side-btn disabled" style="opacity: 0.2; pointer-events: none;" onclick="switchCamera()">🔄</button>
        
        <!-- Direita: Exportar Relatório de Logs JSON -->
        <button class="file-btn" onclick="exportAIData()">📤 EXPORTAR</button>
    </div>

    <!-- Canvas Escondido para Captura de Imagem -->
    <canvas id="captureCanvas"></canvas>

    <script>
        const actionBtn = document.getElementById('actionBtn');
        const stopBtn = document.getElementById('stopBtn');
        const flipBtn = document.getElementById('flipBtn');
        const video = document.getElementById('videoPlayer');
        const demoCanvas = document.getElementById('demoCanvas');
        const placeholder = document.getElementById('placeholder');
        const aiBox = document.getElementById('aiBox');
        const aiStatusText = document.getElementById('aiStatusText');
        const aiLabelText = document.getElementById('aiLabelText');

        let currentStream = null;
        let useFrontCamera = true;
        let isCameraActive = false;
        let isDemoMode = false;
        let aiInterval = null;
        let demoRenderInterval = null;

        // Histórico em memória para Exportação
        let sessionLogs = [];

        function recordLog(message) {
            const timestamp = new Date().toISOString();
            sessionLogs.push({ timestamp, log: message });
            aiStatusText.innerText = message;
        }

        async function handleCameraAction() {
            if (!isCameraActive) {
                await startCamera();
            } else {
                capturePhoto();
            }
        }

        async function startCamera() {
            const mode = useFrontCamera ? "user" : "environment";
            try {
                currentStream = await navigator.mediaDevices.getUserMedia({ 
                    video: { facingMode: mode, width: { ideal: 1280 }, height: { ideal: 720 } }, audio: false 
                });
                
                video.srcObject = currentStream;
                video.style.display = "block";
                demoCanvas.style.display = "none";
                isDemoMode = false;
                
                if (useFrontCamera) video.classList.add('mirror');
                else video.classList.remove('mirror');

                activateInterface();
                recordLog("[SISTEMA]: Inicializado hardware nativo de captura de vídeo.");
            } catch (err) {
                isDemoMode = true;
                video.style.display = "none";
                demoCanvas.style.display = "block";
                
                startVirtualCameraRender();
                activateInterface();
                recordLog("[SISTEMA]: Restrição local detetada. Emulador de Visão IA Ativado.");
            }
        }

        function activateInterface() {
            placeholder.style.display = 'none';
            isCameraActive = true;
            actionBtn.classList.remove('off');
            stopBtn.style.visibility = 'visible';
            flipBtn.style.opacity = "1";
            flipBtn.style.pointerEvents = "auto";
            flipBtn.classList.remove('disabled');
            startAISimulation();
        }

        function stopCamera() {
            if (currentStream) {
                currentStream.getTracks().forEach(track => track.stop());
                currentStream = null;
            }
            if (demoRenderInterval) clearInterval(demoRenderInterval);
            
            video.srcObject = null;
            video.style.display = 'none';
            demoCanvas.style.display = 'none';
            
            placeholder.style.display = 'block';
            isCameraActive = false;

            actionBtn.classList.add('off');
            stopBtn.style.visibility = 'hidden';
