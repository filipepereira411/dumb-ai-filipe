<!DOCTYPE html>
<html lang="pt-PT">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Gestor de Câmara Interna & Rede</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background: #000000; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; height: 100vh; overflow: hidden; display: flex; flex-direction: column; justify-content: space-between; }

        /* Barra de Seleção por "Bolinhas" */
        .selector-container { background: #111111; padding: 15px; border-bottom: 1px solid #222222; display: flex; justify-content: center; gap: 25px; z-index: 10; }
        .radio-option { display: flex; align-items: center; gap: 8px; color: #888888; font-size: 14px; font-weight: 600; cursor: pointer; user-select: none; transition: color 0.2s; }
        
        /* Estilização da Bolinha Nativa */
        .radio-option input[type="radio"] { appearance: none; -webkit-appearance: none; width: 18px; height: 18px; border: 2px solid #555555; border-radius: 50%; outline: none; background: transparent; cursor: pointer; display: grid; place-content: center; transition: border-color 0.2s; }
        .radio-option input[type="radio"]::before { content: ""; width: 10px; height: 10px; border-radius: 50%; transform: scale(0); transition: 0.15s transform ease-in-out; background-color: #22c55e; }
        
        /* Estados Ativos */
        .radio-option input[type="radio"]:checked { border-color: #22c55e; }
        .radio-option input[type="radio"]:checked::before { transform: scale(1); }
        .radio-option.active { color: #ffffff; }

        /* Contentores Principais das Secções */
        .app-section { display: none; flex: 1; width: 100%; overflow: hidden; position: relative; }
        .app-section.active { display: flex; flex-direction: column; }

        /* Modo Ambos (Split Screen Lateral) */
        .split-container { display: flex; width: 100%; height: 100%; }
        .split-left { flex: 1; position: relative; background: #050505; display: flex; flex-direction: column; border-right: 1px solid #1a1a1a; }
        .split-right { flex: 1; background: #000000; overflow-y: auto; }

        /* --- ESTILOS VISOR DA CÂMARA --- */
        .viewer-container { position: relative; flex: 1; width: 100%; background: #0a0a0a; display: flex; align-items: center; justify-content: center; overflow: hidden; }
        video { width: 100%; height: 100%; object-fit: cover; display: none; }
        video.active { display: block; }
        video.mirror { transform: scaleX(-1); }

        .flash-effect { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: #ffffff; opacity: 0; z-index: 5; pointer-events: none; }
        .flash-effect.active { animation: flashAnim 0.2s ease-out; }
        @keyframes flashAnim { 0% { opacity: 1; } 100% { opacity: 0; } }
        .placeholder-text { position: absolute; color: #666666; font-size: 14px; text-align: center; padding: 20px; z-index: 2; }

        /* Controlos Inferiores */
        .bottom-bar { height: 120px; background: #000000; display: flex; align-items: center; justify-content: space-around; padding: 0 20px; border-top: 1px solid #1a1a1a; width: 100%; }
        .cam-btn { width: 65px; height: 65px; border-radius: 50%; background: #ffffff; border: 5px solid #000000; box-shadow: 0 0 0 4px #ffffff; cursor: pointer; transition: transform 0.1s; }
        .cam-btn.off { background: #22c55e; box-shadow: 0 0 0 4px #22c55e; }
        
        .side-btn { width: 45px; height: 45px; border-radius: 50%; background: #1a1a1a; border: 1px solid #333; color: #ffffff; font-size: 18px; display: flex; align-items: center; justify-content: center; cursor: pointer; }
        .side-btn.danger { color: #ef4444; border-color: #ef4444; visibility: hidden; }
        .side-btn.disabled { opacity: 0.2; pointer-events: none; }

        /* --- ESTILOS DO PAINEL DE REDE --- */
        .network-container { padding: 20px; color: #fff; display: flex; flex-direction: column; gap: 15px; }
        .ip-card { background: #111; border: 1px solid #222; border-radius: 12px; padding: 15px; }
        .ip-card h3 { color: #22c55e; font-size: 13px; margin-bottom: 6px; text-transform: uppercase; letter-spacing: 0.5px; }
        .ip-val { font-family: monospace; font-size: 18px; color: #fff; }

        .remote-list { display: flex; flex-direction: column; gap: 10px; margin-top: 5px; }
        .remote-item { background: #111; border: 1px solid #222; border-radius: 8px; padding: 12px; display: flex; justify-content: space-between; align-items: center; }
        .remote-info p { font-size: 14px; font-weight: bold; color: #fff; }
        .remote-info span { font-size: 12px; color: #666; font-family: monospace; }
        
        .action-btn { background: #22c55e; color: #000; border: none; padding: 8px 14px; border-radius: 6px; font-size: 12px; font-weight: bold; cursor: pointer; transition: background 0.2s; }
        .action-btn:hover { background: #16a34a; }

        canvas { display: none; }
    </style>
</head>
<body>

    <!-- Menu Superior com Seletores Circulares (Bolinhas) -->
    <div class="selector-container">
        <label class="radio-option active" id="lblCam">
            <input type="radio" name="viewMode" value="cam" checked onclick="switchView('cam')">
            Câmara
        </label>
        <label class="radio-option" id="lblNet">
            <input type="radio" name="viewMode" value="net" onclick="switchView('net')">
            Rede / IP
        </label>
        <label class="radio-option" id="lblBoth">
            <input type="radio" name="viewMode" value="both" onclick="switchView('both')">
            Ambos
        </label>
    </div>

    <!-- VISTA 1: APENAS CÂMARA -->
    <div id="secCam" class="app-section active">
        <div id="cameraRoot"></div>
    </div>

    <!-- VISTA 2: APENAS REDE -->
    <div id="secNet" class="app-section">
        <div id="networkRoot"></div>
    </div>

    <!-- VISTA 3: AMBOS (SPLIT SCREEN) -->
    <div id="secBoth" class="app-section">
        <div class="split-container">
            <div id="splitLeftTarget" class="split-left"></div>
            <div id="splitRightTarget" class="split-right"></div>
        </div>
    </div>

    <!-- MARCAÇÕES GLOBAIS PARTILHADAS (Movidas dinamicamente via DOM) -->
    <div id="sharedCameraMarkup" style="display: none;">
        <div class="viewer-container" style="height: calc(100% - 120px);">
            <div id="flash" class="flash-effect"></div>
            <div id="placeholder" class="placeholder-text">Dispositivo desligado. Clique no botão verde para iniciar o periférico.</div>
            <video id="videoPlayer" autoplay playsinline></video>
        </div>
        <div class="bottom-bar">
            <button id="stopBtn" class="side-btn danger" onclick="stopCamera()">❌</button>
            <button id="actionBtn" class="cam-btn off" onclick="handleCameraAction()"></button>
            <button id="flipBtn" class="side-btn disabled" onclick="switchCamera()">🔄</button>
        </div>
    </div>

    <div id="sharedNetworkMarkup" style="display: none;">
        <div class="network-container">
            <div class="ip-card">
                <h3>O Seu IP Local (Intranet)</h3>
                <div class="ip-val" id="localIP">192.168.1.15</div>
            </div>
            <div class="ip-card">
                <h3>O Seu IP Público (Internet)</h3>
                <div class="ip-val" id="publicIP">A carregar...</div>
            </div>
            <div style="margin-top: 5px;">
                <h3 style="font-size: 13px; color: #666; margin-bottom: 10px; text-transform: uppercase;">DISPOSITIVOS NA REDE</h3>
                <div class="remote-list">
                    <div class="remote-item">
                        <div class="remote-info">
                            <p>Terminal Sala de Aula (PC-02)</p>
                            <span>192.168.1.45</span>
                        </div>
                        <button class="action-btn" onclick="remoteControl('192.168.1.45')">Remotar</button>
                    </div>
                    <div class="remote-item">
                        <div class="remote-info">
                            <p>Servidor Local PAP</p>
                            <span>192.168.1.100</span>
                        </div>
                        <button class="action-btn" onclick="remoteControl('192.168.1.100')">Remotar</button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <canvas id="captureCanvas"></canvas>

    <script>
        const cameraMarkup = document.getElementById('sharedCameraMarkup');
        const networkMarkup = document.getElementById('sharedNetworkMarkup');

        let currentStream = null;
        let useFrontCamera = true;
        let isCameraActive = false;

        // Montagem estrutural inicial
        window.addEventListener('DOMContentLoaded', () => {
            document.getElementById('cameraRoot').appendChild(cameraMarkup);
            document.getElementById('networkRoot').appendChild(networkMarkup);
            cameraMarkup.style.display = 'block';
            networkMarkup.style.display = 'block';
            fetchPublicIP();
        });

        // Alternador de Vistas baseado nos Radio Buttons (Bolinhas)
        function switchView(mode) {
            // Repor estados de realce do texto das labels
            document.querySelectorAll('.radio-option').forEach(lbl => lbl.classList.remove('active'));
            document.querySelectorAll('.app-section').forEach(sec => sec.classList.remove('active'));
            
            if (mode === 'cam') {
                document.getElementById('lblCam').classList.add('active');
                document.getElementById('secCam').classList.add('active');
