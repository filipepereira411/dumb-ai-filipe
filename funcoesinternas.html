<!DOCTYPE html>
<html lang="pt-PT">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Gestor de Câmara Interna & Rede</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background: #000000; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; height: 100vh; overflow: hidden; display: flex; flex-direction: column; justify-content: space-between; }

        /* Abas Superiores */
        .tabs { display: flex; background: #111; border-bottom: 1px solid #222; z-index: 10; }
        .tab-btn { flex: 1; padding: 15px; background: none; border: none; color: #888; font-weight: bold; cursor: pointer; text-align: center; font-size: 14px; transition: all 0.2s; }
        .tab-btn.active { color: #fff; border-bottom: 3px solid #22c55e; background: #161616; }

        /* Contentores das Secções */
        .app-section { display: none; flex: 1; width: 100%; overflow-y: auto; position: relative; }
        .app-section.active { display: flex; flex-direction: column; }

        /* --- ESTILOS DA CÂMARA --- */
        .viewer-container { position: relative; flex: 1; width: 100%; background: #0a0a0a; display: flex; align-items: center; justify-content: center; overflow: hidden; }
        video { width: 100%; height: 100%; object-fit: cover; display: none; }
        video.active { display: block; }
        video.mirror { transform: scaleX(-1); }

        .flash-effect { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: #ffffff; opacity: 0; z-index: 5; pointer-events: none; }
        .flash-effect.active { animation: flashAnim 0.2s ease-out; }
        @keyframes flashAnim { 0% { opacity: 1; } 100% { opacity: 0; } }
        .placeholder-text { position: absolute; color: #666666; font-size: 14px; text-align: center; padding: 20px; }

        .bottom-bar { height: 120px; background: #000000; display: flex; align-items: center; justify-content: space-around; padding: 0 20px; border-top: 1px solid #1a1a1a; }
        .cam-btn { width: 65px; height: 65px; border-radius: 50%; background: #ffffff; border: 5px solid #000000; box-shadow: 0 0 0 4px #ffffff; cursor: pointer; transition: transform 0.1s; }
        .cam-btn.off { background: #22c55e; box-shadow: 0 0 0 4px #22c55e; }
        
        .side-btn { width: 45px; height: 45px; border-radius: 50%; background: #1a1a1a; border: 1px solid #333; color: #ffffff; font-size: 18px; display: flex; align-items: center; justify-content: center; cursor: pointer; transition: all 0.3s; }
        .side-btn.danger { color: #ef4444; border-color: #ef4444; display: none; }
        .side-btn.disabled { opacity: 0.2; pointer-events: none; }

        /* --- ESTILOS DA REDE --- */
        .network-container { padding: 20px; color: #fff; gap: 20px; }
        .ip-card { background: #111; border: 1px solid #222; border-radius: 12px; padding: 15px; margin-bottom: 15px; }
        .ip-card h3 { color: #22c55e; font-size: 14px; margin-bottom: 8px; text-transform: uppercase; }
        .ip-val { font-family: monospace; font-size: 18px; color: #fff; }

        /* Listagem de Dispositivos Remotos */
        .remote-list { display: flex; flex-direction: column; gap: 10px; margin-top: 10px; }
        .remote-item { background: #161616; border: 1px solid #2a2a2a; border-radius: 8px; padding: 12px; display: flex; justify-content: space-between; align-items: center; }
        .remote-info p { font-size: 14px; font-weight: bold; }
        .remote-info span { font-size: 12px; color: #666; font-family: monospace; }
        
        .action-btn { background: #22c55e; color: #000; border: none; padding: 6px 12px; border-radius: 6px; font-size: 12px; font-weight: bold; cursor: pointer; }
        .action-btn.disconnect { background: #ef4444; color: #fff; }

        canvas { display: none; }
    </style>
</head>
<body>

    <!-- Abas de Navegação -->
    <div class="tabs">
        <button id="tabCam" class="tab-btn active" onclick="switchTab('cam')">📷 CÂMARA</button>
        <button id="tabNet" class="tab-btn" onclick="switchTab('net')">🌐 REDE / IP</button>
    </div>

    <!-- SECCÃO 1: CÂMARA -->
    <div id="secCam" class="app-section active">
        <div class="viewer-container">
            <div id="flash" class="flash-effect"></div>
            <div id="placeholder" class="placeholder-text">Dispositivo desligado. Clique no botão verde para iniciar o periférico.</div>
            <video id="videoPlayer" autoplay playsinline></video>
        </div>

        <div class="bottom-bar">
            <!-- Esquerda: Botão Desligar -->
            <button id="stopBtn" class="side-btn danger" onclick="stopCamera()">❌</button>
            
            <!-- Centro: Ligar / Disparar -->
            <button id="actionBtn" class="cam-btn off"></button>
            
            <!-- Direita: Alternar Câmara -->
            <button id="flipBtn" class="side-btn disabled" onclick="switchCamera()">🔄</button>
        </div>
    </div>

    <!-- SECÇÃO 2: REDE / CONTROLO REMOTO -->
    <div id="secNet" class="app-section network-container">
        <!-- IPs do Dispositivo Atual -->
        <div class="ip-card">
            <h3>O Seu IP Local (Intranet)</h3>
            <div class="ip-val" id="localIP">A detetar...</div>
        </div>
        <div class="ip-card">
            <h3>O Seu IP Público (Internet)</h3>
            <div class="ip-val" id="publicIP">A carregar...</div>
        </div>

        <!-- Remotar / Controlar Outros IPs -->
        <div style="margin-top: 10px;">
            <h3 style="font-size: 14px; color: #888; margin-bottom: 10px;">DISPOSITIVOS DISPONÍVEIS NA REDE</h3>
            <div class="remote-list">
                <!-- IP Remoto 1 -->
                <div class="remote-item">
                    <div class="remote-info">
                        <p>Terminal Sala de Aula (PC-02)</p>
                        <span>112.168.1.45</span>
                    </div>
                    <button class="action-btn" onclick="remoteControl('112.168.1.45')">Remotar</button>
                </div>
                <!-- IP Remoto 2 -->
                <div class="remote-item">
                    <div class="remote-info">
                        <p>Servidor Local PAP</p>
                        <span>112.168.1.100</span>
                    </div>
                    <button class="action-btn" onclick="remoteControl('112.168.1.100')">Remotar</button>
                </div>
            </div>
        </div>
    </div>

    <canvas id="captureCanvas"></canvas>

    <script>
        // Elementos de Controlo
        const actionBtn = document.getElementById('actionBtn');
        const stopBtn = document.getElementById('stopBtn');
        const flipBtn = document.getElementById('flipBtn');
        const video = document.getElementById('videoPlayer');
        const placeholder = document.getElementById('placeholder');

        let currentStream = null;
        let useFrontCamera = true;
        let isCameraActive = false;

        // Gestão de Abas
        function switchTab(tab) {
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            document.querySelectorAll('.app-section').forEach(s => s.classList.remove('active'));
            
            if (tab === 'cam') {
                document.getElementById('tabCam').classList.add('active');
                document.getElementById('secCam').classList.add('active');
            } else {
                document.getElementById('tabNet').classList.add('active');
                document.getElementById('secNet').classList.add('active');
                fetchIPs(); // Atualiza dados de rede
            }
        }

        // Lógica do Botão Central
        actionBtn.addEventListener('click', async () => {
            if (!isCameraActive) {
                await startCamera();
            } else {
                capturePhoto();
            }
        });

        // 1. LIGAR CÂMARA
        async function startCamera() {
            const mode = useFrontCamera ? "user" : "environment";
            try {
                currentStream = await navigator.mediaDevices.getUserMedia({ 
                    video: { facingMode: mode, width: { ideal: 1280 }, height: { ideal: 720 } }, 
                    audio: false 
                });
                
                video.srcObject = currentStream;
                video.classList.add('active');
                if (useFrontCamera) video.classList.add('mirror');
                else video.classList.remove('mirror');

                placeholder.style.display = 'none';
                isCameraActive = true;

                // Atualizar Estado Visual dos Controlos
                actionBtn.classList.remove('off');
                stopBtn.style.display = 'flex';
                flipBtn.classList.remove('disabled');
            } catch (err) {
                alert("Erro ao aceder ao hardware da câmara.");
            }
        }

        // 2. DESLIGAR CÂMARA (Nova Funcionalidade)
        function stopCamera() {
            if (currentStream) {
                // Para todas as pistas de hardware abertas no browser
                currentStream.getTracks().forEach(track => track.stop());
                currentStream = null;
            }
            video.srcObject = null;
            video.classList.remove('active');
            placeholder.style.display = 'block';
            isCameraActive = false;

            // Repõe a interface original
            actionBtn.classList.add('off');
            stopBtn.style.display = 'none';
            flipBtn.classList.add('disabled');
        }

        function switchCamera() {
            if (!isCameraActive) return;
            useFrontCamera = !useFrontCamera;
            startCamera();
        }

        function capturePhoto() {
